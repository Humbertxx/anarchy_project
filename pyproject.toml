[project]
name = "anarchy_project"
version = "0.0.4"
authors = [
  { name="Humberto Bohorquez", email="humberto.bohorquez03@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "alembic>=1.18.5",
    "bertopic==0.17.3",
    "duckdb==1.4.0",
    "fastapi>=0.141.1",
    "joblib>=1.5.3",
    "langchain-text-splitters==0.3.11",
    "pandas==2.3.3",
    "pgvector>=0.5.0",
    "psycopg[binary]>=3.3.4",
    "pyarrow==21.0.0",
    "scikit-learn==1.7.2",
    "scrapy==2.13.3",
    "sentence-transformers==5.1.1",
    "spacy==3.8.11",
    "sqlalchemy>=2.0.51",
    "transformers>=4.57.6",
    "twisted>=24.3.0",
    "uvicorn[standard]>=0.52.0",
]

[project.optional-dependencies]
gpu = [
    "cuml-cu12>=26.6.0 ; platform_machine == 'x86_64' and sys_platform == 'linux'",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["test"]
markers = [
    "database: requires a dedicated PostgreSQL database with pgvector",
    "gpu: requires a CUDA-enabled Runpod environment and model downloads",
]
